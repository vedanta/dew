version: 2

project_name: dew

before:
  hooks:
    - go mod tidy

builds:
  - id: dew
    main: .
    binary: dew
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/vedanta/dew/cmd.version={{.Version}}
      - -X github.com/vedanta/dew/cmd.commit={{.Commit}}
      - -X github.com/vedanta/dew/cmd.date={{.Date}}

archives:
  - id: dew
    formats:
      - tar.gz
    # Windows users expect a zip.
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - README.md
      - LICENSE
      - docs/USER-MANUAL.md
      - docs/COMMANDS.md

checksum:
  name_template: checksums.txt

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

release:
  github:
    owner: vedanta
    name: dew
  draft: false
  prerelease: auto

# Homebrew cask (macOS). Linux users: use the binary download or 'go install'.
homebrew_casks:
  - name: dew
    repository:
      owner: vedanta
      name: homebrew-dew
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    homepage: "https://github.com/vedanta/dew"
    description: "Manage the private local files Git intentionally ignores"
    # Don't publish on prerelease tags.
    skip_upload: auto
    # The binary isn't notarized; strip the quarantine flag on install so it
    # runs without a Gatekeeper prompt.
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/dew"]
          end
