name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Cancel superseded runs on the same ref to save minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast feedback: formatting, vetting, linting. Ubuntu only.
  lint:
    name: Lint & vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt (no diffs allowed)
        run: |
          unformatted="$(gofmt -s -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::These files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest

      - name: Command reference is current
        run: make docs-check

  # Validate the release config so a bad .goreleaser.yaml is caught on PRs,
  # not at tag time.
  goreleaser:
    name: GoReleaser config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          install-only: true
      - run: goreleaser check

  # Unit tests across all target OSes — the cross-platform binary must hold
  # everywhere, especially path handling and permission preservation.
  test:
    name: Unit tests
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build ./...

      - name: Test (race detector)
        run: go test -race -shuffle=on ./...

  # Acceptance scripts drive the built binary. Unix only — the harness is bash.
  # Windows acceptance is deferred (see docs/build-plan.md); Windows is still
  # covered by the unit matrix above. No external tools are installed: crypto
  # uses the native filippo.io/age library, and sync's scp/rsync preflight is
  # exercised via its absence rather than a real transfer.
  acceptance:
    name: Acceptance (binary)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build dew binary
        run: go build -o dew .

      - name: Run acceptance suite
        run: |
          # Existence guard kept as a safety net; the harness lives in
          # test/acceptance/ as of Phase 0.3 (#3).
          if [ -x test/acceptance/run.sh ]; then
            PATH="$PWD:$PATH" ./test/acceptance/run.sh
          else
            echo "::notice::test/acceptance/run.sh not present — skipping."
          fi
